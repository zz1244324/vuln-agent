[project]
name = "vuln-agent"
version = "0.1.0"
description = "A noise filter for pip-audit results: drops name-collision false positives, dedupes advisories, and explains what is left with an LLM."
readme = "README.md"
authors = [
    { name = "zz1244324" }
]
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
vuln-agent = "vuln_agent:main"
vuln-agent-filter = "vuln_agent.filter:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"
